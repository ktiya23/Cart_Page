<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo-container">
                <img src="assests/Meubel House_Logos-05.png" alt="Logo" class="logo">
                <h1 class="brand-name">Marmeto</h1>
            </div>
            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">Shop</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </div>
            <div class="nav-icons">
                <img src="assests/akar-icons_search.png" alt="Search">
                <img src="assests/Vector.png" alt="User">
                <img src="assests/ant-design_shopping-cart-outlined.png" alt="Cart">
            </div>
        </nav>
    </header>
    
    <section class="middle">
            <img src="assests/Meubel House_Logos-05.png" alt="">
            <h1>Cart</h1>
            <h3>Home > Cart</h3>
    </section>

    <main>
        <section class="cart-container">
            <div class="cart-items">
                <table>
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody id="cart-list">

                    </tbody>
                    
                </table>
            </div>
            <aside class="cart-summary">
                <h2>Cart Totals</h2>
                <p>Subtotal: <span id="subtotal">₹0</span></p>
                <p>Total: <span id="total">₹0</span></p>
                <button id="checkout" class="checkout-btn">Check Out</button>
            </aside>
        </section>
    </main>
    
    <footer>
        <div class="footer-info">
            <div class="footer-item">
                <img src="assests/trophy 1.png" alt="High Quality">
                <div>
                    <h3>High Quality</h3>
                    <p>Crafted from top materials</p>
                </div>
            </div>
            <div class="footer-item">
                <img src="assests/guarantee.png" alt="Warranty Protection">
                <div>
                    <h3>Warranty Protection</h3>
                    <p>Over 2 years</p>
                </div>
            </div>
            <div class="footer-item">
                <img src="assests/shipping.png" alt="Free Shipping">
                <div>
                    <h3>Free Shipping</h3>
                    <p>Order over ₹150</p>
                </div>
            </div>
            <div class="footer-item">
                <img src="assests/customer-support.png" alt="Support">
                <div>
                    <h3>24/7 Support</h3>
                    <p>Dedicated support</p>
                </div>
            </div>
        </div>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
